name: Déployer le serveur IA (Cloudflare)

on:
  push:
    branches: [master]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publier le Worker
        run: npx -y wrangler@4.152.0 deploy
      - name: Enregistrer la clé Gemini (secret du Worker)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "::error::Secret GEMINI_API_KEY manquant"; exit 1; fi
          printf '%s' "$GEMINI_API_KEY" | npx -y wrangler@4.152.0 secret put GEMINI_API_KEY
      - name: Enregistrer la clé Resend (alertes e-mail, facultatif)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "Pas de clé Resend : alertes e-mail désactivées."; exit 0; fi
          printf '%s' "$RESEND_API_KEY" | npx -y wrangler@4.152.0 secret put RESEND_API_KEY
      - name: Enregistrer le compte de service Google Play (abonnements, facultatif)
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then echo "Pas de compte de service : vérification des abonnements désactivée."; exit 0; fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT" | npx -y wrangler@4.152.0 secret put PLAY_SERVICE_ACCOUNT
      - name: Vérifier que le serveur répond
        run: |
          sleep 5
          curl -fsS https://kal-track-ai.labarthe-julien1.workers.dev/health
