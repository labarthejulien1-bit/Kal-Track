name: Application Android

# Fabrique l'application Android (Capacitor) :
#  - APK de test « Kal-Track test » à installer à la main sur le téléphone ;
#  - AAB signé pour le Play Store : uniquement sur demande (lancement manuel « Run workflow »),
#    pour regrouper plusieurs modifications dans une même mise à jour du Store.
on:
  push:
    branches: [master, android]
    paths-ignore: ['worker/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      - name: APK de test
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kal-track-test-${{ env.VERSION_NAME }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: AAB Play Store (signé)
        if: github.event_name == 'workflow_dispatch'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Pas encore de clé de signature dans les secrets : AAB non fabriqué."
            exit 0
          fi
          # Ne garde que la clé : retire espaces / retours à la ligne et tout texte copié après elle.
          printf '%s' "$KEYSTORE_BASE64" | python3 -c "
          import re, sys, base64
          s = re.sub(r'\s', '', sys.stdin.read())
          k = re.match(r'[A-Za-z0-9+/]*', s).group(0)
          k += '=' * (-len(k) % 4)
          sys.stdout.buffer.write(base64.b64decode(k))
          " > "$RUNNER_TEMP/upload.keystore"
          echo "Clé : $(wc -c < "$RUNNER_TEMP/upload.keystore") octets"
          KEYSTORE_FILE="$RUNNER_TEMP/upload.keystore" ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.keystore"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: kal-track-playstore-${{ env.VERSION_NAME }}-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
